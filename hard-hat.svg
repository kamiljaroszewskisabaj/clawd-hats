<?xml version="1.0" encoding="UTF-8"?>
<!-- Hard hat: pixel art (13x6 grid). Safety-yellow dome, centre ridge, wide brim. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 13 6" shape-rendering="crispEdges" width="13" height="6">
  <g fill="#f5c518">
    <rect x="4" y="0" width="5" height="1"/>
    <rect x="2" y="1" width="9" height="1"/>
    <rect x="1" y="2" width="11" height="1"/>
    <rect x="1" y="3" width="11" height="1"/>
    <rect x="1" y="4" width="11" height="1"/>
  </g>
  <g fill="#d9a514">
    <rect x="8" y="0" width="1" height="1"/>
    <rect x="9" y="1" width="2" height="1"/>
    <rect x="10" y="2" width="2" height="1"/>
    <rect x="10" y="3" width="2" height="1"/>
    <rect x="10" y="4" width="2" height="1"/>
  </g>
  <g fill="#ffe27a">
    <rect x="6" y="0" width="1" height="1"/>
    <rect x="6" y="1" width="1" height="1"/>
    <rect x="6" y="2" width="1" height="1"/>
    <rect x="6" y="3" width="1" height="1"/>
    <rect x="2" y="2" width="1" height="1"/>
  </g>
  <rect x="1" y="4" width="11" height="1" fill="#e0ad12"/>
  <rect x="0" y="5" width="13" height="1" fill="#b8860b"/>
</svg>
