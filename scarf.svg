<?xml version="1.0" encoding="UTF-8"?>
<!-- Scarf: pixel art (13x5 grid). Red knit band with dark red stripes across the shoulders, striped hanging tail. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 13 5" shape-rendering="crispEdges" width="13" height="5">
  <rect x="0" y="0" width="13" height="1" fill="#d1453b"/>
  <rect x="0" y="1" width="13" height="1" fill="#b83a31"/>
  <g fill="#8f2a23">
    <rect x="0" y="0" width="1" height="2"/>
    <rect x="12" y="0" width="1" height="2"/>
  </g>
  <g fill="#8f2a23">
    <rect x="2" y="0" width="1" height="2"/>
    <rect x="6" y="0" width="1" height="2"/>
    <rect x="10" y="0" width="1" height="2"/>
  </g>
  <rect x="8" y="2" width="1" height="1" fill="#d1453b"/>
  <rect x="9" y="2" width="1" height="1" fill="#b83a31"/>
  <rect x="8" y="3" width="2" height="1" fill="#8f2a23"/>
  <rect x="8" y="4" width="1" height="1" fill="#d1453b"/>
  <rect x="9" y="4" width="1" height="1" fill="#b83a31"/>
</svg>
