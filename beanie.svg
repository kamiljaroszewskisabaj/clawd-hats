<?xml version="1.0" encoding="UTF-8"?>
<!-- Beanie: pixel art (13x7 grid). Pompom, knit crown, ribbed fold-up cuff. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 13 7" shape-rendering="crispEdges" width="13" height="7">
  <g fill="#f2ede4">
    <rect x="5" y="0" width="3" height="1"/>
    <rect x="5" y="1" width="2" height="1"/>
  </g>
  <rect x="7" y="1" width="1" height="1" fill="#d6cdbf"/>
  <g fill="#d1453b">
    <rect x="3" y="2" width="7" height="1"/>
    <rect x="2" y="3" width="9" height="1"/>
    <rect x="1" y="4" width="11" height="1"/>
  </g>
  <g fill="#a8322b">
    <rect x="9" y="2" width="1" height="1"/>
    <rect x="9" y="3" width="2" height="1"/>
    <rect x="10" y="4" width="2" height="1"/>
  </g>
  <rect x="4" y="3" width="1" height="1" fill="#e2685e"/>
  <rect x="0" y="5" width="13" height="2" fill="#b83a31"/>
  <g fill="#8f2a23">
    <rect x="1" y="5" width="1" height="2"/>
    <rect x="3" y="5" width="1" height="2"/>
    <rect x="5" y="5" width="1" height="2"/>
    <rect x="7" y="5" width="1" height="2"/>
    <rect x="9" y="5" width="1" height="2"/>
    <rect x="11" y="5" width="1" height="2"/>
  </g>
</svg>
